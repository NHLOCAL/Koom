name: wakewise_app # מומלץ לתת שם פרויקט תקין, למשל wakewise_app
description: "A new Flutter project."
publish_to: 'none' # הסר שורה זו אם תרצה לפרסם את החבילה

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # טווח SDK רחב יותר ומומלץ

# --- סעיף התלויות (Dependencies) ---
# כאן רושמים רק את החבילות שהפרויקט צריך
dependencies:
  flutter:
    sdk: flutter
  
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^19.3.0
  audioplayers: ^6.0.0
  uuid: ^4.4.0
  intl: ^0.20.2
  permission_handler: ^12.0.0+1
  flutter_background_service: ^5.0.5
  flutter_localizations:
    sdk: flutter

# --- סעיף תלויות לפיתוח (Dev Dependencies) ---
# חבילות שמשמשות רק לבדיקות וניתוח קוד
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# --- סעיף הגדרות פלאטר (Flutter Specific Settings) ---
# זהו המקום הנכון להגדרות כמו assets, fonts וכו'.
flutter:
  
  # שורה זו מפעילה את השימוש באייקונים של Material Design
  uses-material-design: true

  # כאן מגדירים את ה-assets (נכסים) של האפליקציה, כמו תמונות וקבצי שמע
  assets:
    - assets/audio/

  # דוגמאות להוספת פונטים (לא בשימוש כרגע בפרויקט)
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic