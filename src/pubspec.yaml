name: koom
description: "A puzzle alarm clock to help you wake up wisely."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'



dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^19.3.0
  audioplayers: ^6.0.0
  uuid: ^4.4.0
  intl: ^0.20.2
  permission_handler: ^12.0.0+1
  flutter_background_service: ^5.0.5
  flutter_localizations:
    sdk: flutter
  image: ^4.1.4 # Added for image manipulation
  timezone: ^0.10.1 # Added for notification service



flutter:


  uses-material-design: true


  assets:
    - assets/audio/
    - assets/images/ # Added for image puzzles

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"
